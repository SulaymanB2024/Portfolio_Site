name: Apply reviewed indexability improvements
on:
  push:
    branches: [atlas/indexability-readiness-2026-09-10]
    paths:
      - .github/workflows/apply-indexability-readiness.yml
      - scripts/apply-indexability-patches.py
      - scripts/indexability-patches/**
permissions:
  contents: read
concurrency:
  group: indexability-readiness-application
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'SulaymanB2024/Portfolio_Site' && github.ref == 'refs/heads/atlas/indexability-readiness-2026-09-10'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: python3 scripts/apply-indexability-patches.py
      - run: npm ci
      - run: npm run generate:article-routes && npm run generate:public
      - run: python3 -m pip install playwright==1.57.0
      - name: Validate the changed source and built pages
        run: |
          npm run test:bot-observer
          npm run test:portfolio-analytics
          npm run test:seo-schema
          npm run test:site-integrity
          npm run test:site-behavior
          npm run test:indexability
          npm run verify:profile
          npm run verify:bot-observer
          npm run verify:generated
          npm run lint
          npm run build
          npm run verify:seo
          npm run verify:vercel-seo
          npm run verify:internal-links
          npm run verify:keywords
          npm run verify:reduction
          npm run audit:style
          npm run verify:security
          npm run verify:pseo
          npm run verify:site-integrity
          npm run verify:static-idempotence
      - name: Verify successful rendering and readable failure modes
        run: |
          python3 scripts/browser-smoke.py
          python3 scripts/browser-indexability.py
      - name: Commit the validated source on the review branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json public scripts src docs
          git diff --cached --stat
          git commit -m 'fix: keep initial documents readable, restore research discovery and improve diagnostics'
          git push origin HEAD:refs/heads/atlas/indexability-readiness-2026-09-10
      - name: Retain actual test evidence
        if: always()
        run: |
          mkdir -p audit-artifact
          git rev-parse HEAD > audit-artifact/commit.txt
          git diff > audit-artifact/workspace.diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexability-review-${{ github.sha }}
          path: audit-artifact/
          retention-days: 3
