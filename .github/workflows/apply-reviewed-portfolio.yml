name: Refresh reviewed dependency fixes
on:
  push:
    branches: [atlas/portfolio-substantive-fixes-2026-09-10]
    paths: [.github/workflows/apply-reviewed-portfolio.yml]
permissions:
  contents: read
concurrency:
  group: apply-reviewed-portfolio-repair
  cancel-in-progress: false
jobs:
  refresh:
    if: github.repository == 'SulaymanB2024/Portfolio_Site' && github.ref == 'refs/heads/atlas/portfolio-substantive-fixes-2026-09-10'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Refresh the three vulnerable transitive packages within existing ranges
        run: |
          mkdir -p audit-artifact
          npm update baseline-browser-mapping browserslist nanoid --package-lock-only --ignore-scripts --no-fund
          git diff --exit-code -- package.json
          git diff -- package-lock.json > audit-artifact/dependency-update.diff
          npm ci
          npm audit --json > audit-artifact/npm-audit.json
      - run: python3 -m pip install playwright==1.57.0
      - name: Test source and build against the refreshed lockfile
        run: |
          npm run test:bot-observer
          npm run test:portfolio-analytics
          npm run test:seo-schema
          npm run test:site-integrity
          npm run test:site-behavior
          npm run verify:profile
          npm run verify:bot-observer
          npm run verify:generated
          npm run lint
          npm run build
          npm run verify:seo
          npm run verify:vercel-seo
          npm run verify:internal-links
          npm run verify:keywords
          npm run verify:reduction
          npm run audit:style
          npm run verify:security
          npm run verify:pseo
          npm run verify:site-integrity
          npm run verify:static-idempotence
          python3 scripts/browser-smoke.py
      - name: Commit the tested dependency lockfile
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git diff --cached --stat
          git commit -m 'fix: update vulnerable browser-mapping, browserslist and nanoid dependencies'
          git push origin HEAD:refs/heads/atlas/portfolio-substantive-fixes-2026-09-10
      - name: Retain dependency and browser evidence
        if: always()
        run: |
          mkdir -p audit-artifact
          git rev-parse HEAD > audit-artifact/commit.txt
          cp package-lock.json audit-artifact/package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-repair-${{ github.sha }}
          path: audit-artifact/
          retention-days: 1
