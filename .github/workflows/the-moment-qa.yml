name: The Moment editorial QA
on:
  pull_request:
    paths:
      - 'src/content/theMoment*'
      - 'src/pages/TheMomentPage.tsx'
      - 'src/pages/the-moment.css'
      - 'src/seo/theMomentStatic.ts'
      - 'public/the-moment/**'
      - 'scripts/*moment*'
      - '.github/workflows/the-moment-qa.yml'
  push:
    branches: [main]
    paths:
      - 'src/content/theMoment*'
      - 'src/pages/TheMomentPage.tsx'
      - 'src/pages/the-moment.css'
      - 'src/seo/theMomentStatic.ts'
      - 'public/the-moment/**'
      - 'scripts/*moment*'
      - '.github/workflows/the-moment-qa.yml'
permissions:
  contents: read
concurrency:
  group: moment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editorial-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:generated
      - name: Install browser audit dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts axe-core@4.10.3
          python -m pip install crawl4ai==0.7.4 playwright==1.57.0 beautifulsoup4==4.13.4
          python -m playwright install --with-deps chromium
      - name: Crawl and test the built page
        run: python scripts/qa-the-moment.py
      - name: Crawl and test the public deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/qa-the-moment.py --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moment-qa-evidence-${{ github.sha }}
          path: audit-artifact/the-moment
          if-no-files-found: error
          retention-days: 14
