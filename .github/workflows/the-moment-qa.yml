name: The Moment editorial QA
on:
  push:
    branches: [atlas/the-moment-editorial]
  pull_request:
    paths:
      - 'src/**'
      - 'public/the-moment/**'
      - 'scripts/*moment*'
      - '.github/workflows/the-moment-qa.yml'
permissions:
  contents: read
concurrency:
  group: moment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  editorial-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preserve tracked source for reproducible review
        run: git archive --format=tar.gz HEAD > /tmp/portfolio-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-source
          path: /tmp/portfolio-source.tar.gz
          retention-days: 7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Run editorial browser and crawl checks
        if: ${{ hashFiles('scripts/qa-the-moment.py') != '' }}
        run: |
          python -m pip install crawl4ai==0.7.4 beautifulsoup4
          python -m playwright install --with-deps chromium
          python scripts/qa-the-moment.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moment-qa-evidence
          path: audit-artifact/the-moment
          if-no-files-found: ignore
          retention-days: 14
