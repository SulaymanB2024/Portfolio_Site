name: Research release review

on:
  push:
    branches: [atlas/personal-site-audit-and-research-20260907]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - '.github/workflows/research-release-review.yml'

permissions:
  contents: read

concurrency:
  group: research-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate content, calculations and generated output
        run: |
          npm run verify:generated
          npm run lint
          npm run build
          npm run verify:research-release
          npm run verify:pseo
          npm run verify:articles
          npm run verify:seo
          npm run verify:internal-links
      - name: Install isolated browser test dependency
        run: |
          npm install --prefix /tmp/research-browser --no-audit --no-fund playwright@1.55.0
          /tmp/research-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise built pages in Chromium
        run: node scripts/verify-research-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-browser-review-${{ github.sha }}
          path: output/research-review
          retention-days: 7
          if-no-files-found: warn
