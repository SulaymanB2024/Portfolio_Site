name: Research release review

on:
  push:
    branches: [atlas/personal-site-audit-and-research-20260907]
  pull_request:
    paths:
      - 'src/content/researchRelease/**'
      - 'src/content/articleRegistry.ts'
      - 'src/content/publicationIndex.ts'
      - 'scripts/verify-research-release.ts'
      - '.github/workflows/research-release-review.yml'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate research release
        run: |
          if [ -f scripts/verify-research-release.ts ]; then
            node --import tsx scripts/verify-research-release.ts
          fi
          npm run lint
          npm run build
      - name: Package reproducible review inputs
        if: always()
        run: |
          mkdir -p /tmp/research-review
          git archive --format=tar HEAD | tar -xf - -C /tmp/research-review
          find /tmp/research-review -type f \( -iname '*.woff' -o -iname '*.woff2' -o -iname '*.ttf' -o -iname '*.otf' \) -delete
          tar -czf research-review-source.tar.gz -C /tmp/research-review .
          tar --exclude='*.woff' --exclude='*.woff2' --exclude='*.ttf' --exclude='*.otf' -czf research-review-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-review-${{ github.sha }}
          path: research-review-*.tar.gz
          retention-days: 7
          if-no-files-found: error
