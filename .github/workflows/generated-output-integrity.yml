name: Generated output integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify:generated
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:seo
      - run: npm run verify:reduction
      - run: npm run audit:style
      - run: npm run verify:security
