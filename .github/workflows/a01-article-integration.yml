name: A01 article integration

on:
  push:
    branches:
      - content/us-toll-road-ownership-article

permissions:
  contents: write

jobs:
  verify-and-report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run generate:article-routes
      - run: npm run generate:public
      - run: npm run build

      - name: Run the complete verification suite and preserve output
        shell: bash
        run: |
          set +e
          report=.github/a01-ci-report.txt
          : > "$report"
          overall=0

          run_check() {
            label="$1"
            shift
            {
              echo "## ${label}"
              echo '$ ' "$@"
            } >> "$report"
            "$@" >> "$report" 2>&1
            code=$?
            echo "exit_code=${code}" >> "$report"
            echo >> "$report"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }

          run_check test:bot-observer npm run test:bot-observer
          run_check test:portfolio-analytics npm run test:portfolio-analytics
          run_check test:seo-schema npm run test:seo-schema
          run_check verify:bot-observer npm run verify:bot-observer
          run_check verify:generated npm run verify:generated
          run_check lint npm run lint
          run_check verify:seo npm run verify:seo
          run_check verify:vercel-seo npm run verify:vercel-seo
          run_check verify:internal-links npm run verify:internal-links
          run_check verify:keywords npm run verify:keywords
          run_check verify:reduction npm run verify:reduction
          run_check audit:style npm run audit:style
          run_check verify:security npm run verify:security

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$report"
          git commit -m "Record A01 integration verification results" || true
          git push origin HEAD:content/us-toll-road-ownership-article
          exit "$overall"
