name: A01 article integration

on:
  push:
    branches:
      - content/us-toll-road-ownership-article

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Update publication archive regression assertions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'scripts/verify-ai-search-seo.mjs';
          let source = fs.readFileSync(path, 'utf8');
          const oldLine = "assert(textFromHtml(research).includes('28 Notes and Artifacts'), 'research: publication count is not derived as twenty-eight');";
          const newLine = "assert(textFromHtml(research).includes('29 Notes and Artifacts'), 'research: publication count is not derived as twenty-nine');";
          if (source.includes(oldLine)) source = source.replace(oldLine, newLine);
          if (!source.includes(newLine)) throw new Error('Publication-count assertion anchor missing');

          const articleAssertion = "assert(textFromHtml(research).includes('Who Owns 25 of America’s Major Toll Roads?'), 'research: national toll-road ownership article missing');";
          if (!source.includes(articleAssertion)) {
            const anchor = "assert(textFromHtml(research).includes('Who Owns West Campus Student Housing?'), 'research: West Campus housing article missing');";
            if (!source.includes(anchor)) throw new Error('Research article assertion anchor missing');
            source = source.replace(anchor, `${anchor}\n${articleAssertion}`);
          }
          fs.writeFileSync(path, source);
          NODE

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify-ai-search-seo.mjs
          git commit -m "Update SEO regression checks for national toll-road article" || true
          git push origin HEAD:content/us-toll-road-ownership-article

      - run: npm ci
      - run: npm run generate:article-routes
      - run: npm run generate:public
      - run: npm run test:bot-observer
      - run: npm run test:portfolio-analytics
      - run: npm run test:seo-schema
      - run: npm run verify:bot-observer
      - run: npm run verify:generated
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:seo
      - run: npm run verify:vercel-seo
      - run: npm run verify:internal-links
      - run: npm run verify:keywords
      - run: npm run verify:reduction
      - run: npm run audit:style
      - run: npm run verify:security
