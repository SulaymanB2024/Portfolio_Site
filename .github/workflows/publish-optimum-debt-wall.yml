name: Publish Optimum debt-wall research

on:
  push:
    branches:
      - content/optimum-2027-debt-wall

permissions:
  contents: write

concurrency:
  group: publish-optimum-debt-wall
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[article-publish-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Materialize the audited article package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import io
          import zipfile

          part_names = [
              'optimum-web-text-assets.b64x.part00',
              'optimum-web-text-assets.b64x.part01',
              'optimum-web-text-assets.b64x.part02',
              'optimum-web-text-assets.b64x.part03',
              'optimum-web-text-assets.b64x.part04a',
              'optimum-web-text-assets.b64x.part04b',
              'optimum-web-text-assets.b64x.part05',
              'optimum-web-text-assets.b64x.part06',
          ]
          parts = [Path('scripts') / name for name in part_names]
          missing = [str(part) for part in parts if not part.exists()]
          if missing:
              raise SystemExit(f'Missing article package parts: {missing}')
          payload = ''.join(part.read_text(encoding='ascii') for part in parts)
          archive = base64.b64decode(payload.encode('ascii'), validate=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
              bundle.extractall('.')
          print(f'Extracted {len(bundle.namelist())} article files from {len(parts)} package parts')
          PY
      - run: npm ci
      - name: Integrate article into current site architecture
        run: node scripts/apply-optimum-debt-wall.mjs
      - name: Prepare SVG hero and validator support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import re

          hero_path = Path('public/images/research/optimum-2027-debt-wall-reader-hero.svg')
          hero = hero_path.read_text(encoding='utf-8')
          hero, count = re.subn(
              r'(<svg\b[^>]*?)\swidth="[^"]+"\sheight="[^"]+"',
              r'\1 width="1800" height="1200"',
              hero,
              count=1,
          )
          if count != 1:
              raise SystemExit('Could not normalize hero SVG dimensions')
          hero_path.write_text(hero, encoding='utf-8')

          verifier_path = Path('scripts/verify-technical-article-series.ts')
          verifier = verifier_path.read_text(encoding='utf-8')
          count_before = "assert(ALL_ARTICLES.length === 23, `expected 23 canonical articles; found ${ALL_ARTICLES.length}`);"
          count_after = "assert(ALL_ARTICLES.length === 24, `expected 24 canonical articles; found ${ALL_ARTICLES.length}`);"
          if count_before in verifier:
              verifier = verifier.replace(count_before, count_after, 1)
          elif count_after not in verifier:
              raise SystemExit('Could not update canonical article count')
          marker = 'SVG artwork may be text rather than a binary raster header.'
          if marker not in verifier:
              needle = "  throw new Error(`Unsupported image header: ${filePath}`);"
              svg_support = base64.b64decode(
                  ''
              ).decode('utf-8')
              if verifier.count(needle) != 1:
                  raise SystemExit('Could not locate image-header verifier insertion point')
              verifier = verifier.replace(needle, svg_support + needle)
              verifier_path.write_text(verifier, encoding='utf-8')
          PY
      - name: Regenerate tracked article and public manifests
        run: |
          npm run generate:article-routes
          npm run generate:public
      - name: Remove one-use automation from the final branch
        run: |
          rm .github/workflows/publish-optimum-debt-wall.yml
          rm scripts/apply-optimum-debt-wall.mjs
          rm scripts/optimum-web-text-assets.b64x.part*
          rm -f scripts/optimum-web-text-assets.b85.part*
      - name: Validate article and repository
        run: |
          npm run test:bot-observer
          npm run test:portfolio-analytics
          npm run verify:bot-observer
          npm run verify:generated
          npm run lint
          npm run build
          npm run verify:articles
          npm run verify:article-ranking
          npm run verify:internal-links
          npm run verify:keywords
          npm run verify:seo
          npm run verify:reduction
          npm run audit:style
          npm run verify:security
      - name: Commit generated publication bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Content: publish Optimum debt-wall research [article-publish-complete]"
          git push origin HEAD:${{ github.ref_name }}
