name: Temporary export internship research inputs

on:
  push:
    branches:
      - content/internship-posting-lifespans
    paths:
      - .github/workflows/temporary-export-internship-research-inputs.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research branch
        uses: actions/checkout@v5
        with:
          ref: content/internship-posting-lifespans

      - name: Collect source snapshot and repository archive
        run: |
          mkdir -p export
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/SimplifyJobs/Summer2027-Internships/3c16fd5d8ff8fe54a073bccfdb1990fa01e8154b/.github/scripts/listings.json \
            --output export/listings.json
          git archive --format=zip --output=export/site-source.zip HEAD
          sha256sum export/listings.json export/site-source.zip > export/SHA256SUMS.txt

      - name: Upload research inputs
        uses: actions/upload-artifact@v4
        with:
          name: internship-research-inputs
          path: export
          if-no-files-found: error
          retention-days: 7
