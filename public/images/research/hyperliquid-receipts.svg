<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Mixed receipts are not a pure trading take rate</title><desc id="desc">Reported fees $85.39m and holder receipts $69.72m over 30 days. Both include reserve income. Difference $15.67m is not corporate operating cost.</desc><rect width="720" height="520" fill="#F6F3EA"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="46" font-size="19" fill="#516169" font-weight="600" text-anchor="start">01 / OBSERVED RECEIPTS</text><text x="36" y="88" font-size="30" fill="#172A30" font-weight="700" text-anchor="start">The headline is not a trading take rate.</text><text x="36" y="124" font-size="21" fill="#516169" font-weight="400" text-anchor="start">DeFiLlama perpetuals product · trailing 30 days</text><text x="36" y="195" font-size="24" fill="#172A30" font-weight="400" text-anchor="start">Reported fees</text><rect x="36" y="211" width="478.18399999999997" height="36" fill="#B3C4C3"/><text x="656" y="240" font-size="24" fill="#172A30" font-weight="700" text-anchor="end">$85.39m</text><text x="36" y="310" font-size="24" fill="#172A30" font-weight="400" text-anchor="start">Holder receipts</text><rect x="36" y="326" width="390.432" height="36" fill="#176A75"/><text x="656" y="355" font-size="24" fill="#172A30" font-weight="700" text-anchor="end">$69.72m</text><text x="36" y="419" font-size="27" fill="#172A30" font-weight="700" text-anchor="start">Both totals include reserve income.</text><text x="36" y="455" font-size="22" fill="#516169" font-weight="400" text-anchor="start">$15.67m difference is not corporate operating cost.</text><text x="36" y="491" font-size="18" fill="#516169" font-weight="400" text-anchor="start">Snapshot: 14 Oct 2026 · provider definitions, not audited earnings</text></g></svg>
