<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">The label hides two income streams.</title><desc id="desc">Fees $85.39m and holder receipts $69.72m include reserve yield. Their $15.67m difference is not corporate operating expense.</desc><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6"><path d="M-1 1L1-1M0 6L6 0M5 7L7 5" stroke="#68665e" stroke-width="1.3"/></pattern></defs><rect x="0.000" y="0.000" width="720.000" height="460.000" fill="#f5f2ea"/><g font-family="Arial, Helvetica, sans-serif"><text x="34" y="35" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">01 / HYPERLIQUID</text><text x="34" y="79" font-size="29" fill="#24221e" font-weight="600" text-anchor="start">The label hides two income streams.</text><text x="34" y="113" font-size="18" fill="#68665e" font-weight="400" text-anchor="start">Trailing 30 days / provider product classification</text><text x="34" y="173" font-size="22" fill="#24221e" font-weight="400" text-anchor="start">Perps-product fees</text><rect x="34.000" y="190.000" width="520.000" height="40.000" fill="#b7b1a4"/><text x="686" y="219" font-size="27" fill="#24221e" font-weight="600" text-anchor="end">$85.39m</text><text x="34" y="278" font-size="22" fill="#24221e" font-weight="400" text-anchor="start">Holder receipts</text><rect x="34.000" y="295.000" width="424.574" height="40.000" fill="#24221e"/><text x="686" y="325" font-size="27" fill="#24221e" font-weight="600" text-anchor="end">$69.72m</text><text x="34" y="384" font-size="25" fill="#24221e" font-weight="600" text-anchor="start">Both include AQAv2 reserve income.</text><line x1="34" x2="686" y1="418" y2="418" stroke="#b7b1a4"/><text x="34" y="444" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">DeFiLlama snapshot: 14 Oct 2026. Not an audited corporate P&amp;L.</text></g></svg>
