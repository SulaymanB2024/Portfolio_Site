<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Archived research method frame</title>
  <desc id="desc">A quiet three-part diagram separates historical assumptions, required evidence, and the current claim limit.</desc>
  <rect width="1200" height="630" fill="#f1efe8"/>
  <g fill="none" stroke="#11110f" stroke-width="1">
    <path d="M0 91H1200M0 539H1200" opacity=".18"/>
    <rect x="117" y="198" width="274" height="234"/>
    <rect x="463" y="198" width="274" height="234"/>
    <rect x="809" y="198" width="274" height="234"/>
    <path d="M391 315H463M737 315H809"/>
    <circle cx="427" cy="315" r="5" fill="#934b43" stroke="none"/>
    <circle cx="773" cy="315" r="5" fill="#934b43" stroke="none"/>
  </g>
  <g fill="#11110f" font-family="Arial, Helvetica, sans-serif">
    <text x="149" y="235" font-size="10" letter-spacing="2">01 / HISTORICAL</text>
    <text x="149" y="312" font-family="Georgia, serif" font-size="32">Assumption</text>
    <text x="149" y="353" font-size="11" letter-spacing="1.5" opacity=".58">NAME THE FRAME</text>
    <text x="495" y="235" font-size="10" letter-spacing="2">02 / REQUIRED</text>
    <text x="495" y="312" font-family="Georgia, serif" font-size="32">Evidence</text>
    <text x="495" y="353" font-size="11" letter-spacing="1.5" opacity=".58">SHOW THE RECORD</text>
    <text x="841" y="235" font-size="10" letter-spacing="2">03 / CURRENT</text>
    <text x="841" y="312" font-family="Georgia, serif" font-size="32">Limit</text>
    <text x="841" y="353" font-size="11" letter-spacing="1.5" opacity=".58">DO NOT OVERCLAIM</text>
  </g>
  <g fill="#934b43" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">
    <text x="49" y="58">ARCHIVE / METHOD, NOT RECOMMENDATION</text>
    <text x="856" y="589">HISTORICAL CONTEXT ONLY</text>
  </g>
</svg>
