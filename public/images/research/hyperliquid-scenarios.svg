<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">One return hurdle. Three outcomes.</title><desc id="desc">At 18% return, 3% terminal growth, and 955.31m claims: $4.24, $29.96 and $126.36. Dashed marks show an $80 reference.</desc><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6"><path d="M-1 1L1-1M0 6L6 0M5 7L7 5" stroke="#68665e" stroke-width="1.3"/></pattern></defs><rect x="0.000" y="0.000" width="720.000" height="460.000" fill="#f5f2ea"/><g font-family="Arial, Helvetica, sans-serif"><text x="34" y="35" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">04 / HYPERLIQUID</text><text x="34" y="79" font-size="29" fill="#24221e" font-weight="600" text-anchor="start">One return hurdle. Three outcomes.</text><text x="34" y="113" font-size="18" fill="#68665e" font-weight="400" text-anchor="start">18% return / 3% terminal growth / 955.31m claims</text><text x="34" y="168" font-size="21" fill="#24221e" font-weight="400" text-anchor="start">Erosion</text><rect x="34.000" y="183.000" width="16.298" height="34.000" fill="#b7b1a4"/><line x1="341.6923076923077" x2="341.6923076923077" y1="178" y2="221" stroke="#24221e" stroke-dasharray="4 4"/><text x="686" y="211" font-size="26" fill="#24221e" font-weight="600" text-anchor="end">$4.24</text><text x="34" y="260" font-size="21" fill="#24221e" font-weight="400" text-anchor="start">Strong execution</text><rect x="34.000" y="275.000" width="115.250" height="34.000" fill="#24221e"/><line x1="341.6923076923077" x2="341.6923076923077" y1="270" y2="313" stroke="#24221e" stroke-dasharray="4 4"/><text x="686" y="303" font-size="26" fill="#24221e" font-weight="600" text-anchor="end">$29.96</text><text x="34" y="352" font-size="21" fill="#24221e" font-weight="400" text-anchor="start">Dominant infrastructure</text><rect x="34.000" y="367.000" width="485.986" height="34.000" fill="#b7b1a4"/><line x1="341.6923076923077" x2="341.6923076923077" y1="362" y2="405" stroke="#24221e" stroke-dasharray="4 4"/><text x="686" y="395" font-size="26" fill="#24221e" font-weight="600" text-anchor="end">$126.36</text><text x="440" y="157" font-size="16" fill="#68665e" font-weight="400" text-anchor="start">$80 reference</text><line x1="34" x2="686" y1="418" y2="418" stroke="#b7b1a4"/><text x="34" y="444" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">Author scenarios. Not probabilities, trading targets or a price floor.</text></g></svg>
