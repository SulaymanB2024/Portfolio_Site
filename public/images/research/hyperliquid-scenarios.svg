<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Conditional HYPE present values under three operating cases</title><desc id="desc">At 18% discount rate, 3% terminal growth and 955.31m claims: bear $4.24, base $29.96, bull $126.36. Dashed line is an $80 illustrative reference, not a live quote.</desc><rect width="720" height="520" fill="#F6F3EA"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="46" font-size="19" fill="#516169" font-weight="600" text-anchor="start">04 / CONDITIONAL PRESENT VALUES</text><text x="36" y="88" font-size="32" fill="#172A30" font-weight="700" text-anchor="start">One return hurdle. Three outcomes.</text><text x="36" y="124" font-size="21" fill="#516169" font-weight="400" text-anchor="start">18% return · 3% terminal growth · 955.31m claims</text><text x="36" y="190" font-size="23" fill="#172A30" font-weight="400" text-anchor="start">Erosion</text><rect x="36" y="206" width="16.587070715721495" height="36" fill="#B3C4C3"/><text x="680" y="234" font-size="26" fill="#172A30" font-weight="700" text-anchor="end">$4.24</text><text x="36" y="290" font-size="23" fill="#172A30" font-weight="400" text-anchor="start">Strong execution</text><rect x="36" y="306" width="117.29115659920154" height="36" fill="#176A75"/><text x="680" y="334" font-size="26" fill="#172A30" font-weight="700" text-anchor="end">$29.96</text><text x="36" y="390" font-size="23" fill="#172A30" font-weight="400" text-anchor="start">Dominant infrastructure</text><rect x="36" y="406" width="494.5949127199998" height="36" fill="#B3C4C3"/><text x="680" y="434" font-size="26" fill="#172A30" font-weight="700" text-anchor="end">$126.36</text><line x1="349.1428571428571" y1="160" x2="349.1428571428571" y2="449" stroke="#516169" stroke-width="2" stroke-dasharray="5 5"/><text x="359.1428571428571" y="170" font-size="19" fill="#516169" font-weight="400" text-anchor="start">$80 reference</text><text x="36" y="490" font-size="19" fill="#516169" font-weight="400" text-anchor="start">Scenarios, not probabilities or a price floor. Valuation date: 14 Oct 2026.</text></g></svg>
