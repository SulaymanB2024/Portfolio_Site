<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Higher margins can replace some required scale.</title><desc id="desc">Reverse valuation at 18%, 22% and 26% mature margins for $61B and $100B equity bridges. At base 22% requires $99.5B and $162.9B revenue. A 26% margin reduces the $61B hurdle to $81.1B.</desc><rect x="0.00" y="0.00" width="1200.00" height="760.00" fill="#f5f2e9"/><text x="56.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="700">ANDURIL / 06 / REVENUE IMPLIED BY PRICE</text><text x="1144.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="end" font-weight="400">14 OCT 2026</text><line x1="56.00" y1="66.00" x2="1144.00" y2="66.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="124.00" font-family="Georgia,serif" font-size="40" fill="#202723" text-anchor="start" font-weight="400">Higher margins can replace some required scale.</text><text x="56.00" y="166.00" font-family="Arial,sans-serif" font-size="22" fill="#59615a" text-anchor="start" font-weight="400">Annual revenue required in 2036 · $B · changes are phased through the full forecast</text><text x="56.00" y="225.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="start" font-weight="400">Mature EBIT margin</text><text x="540.00" y="225.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">For $61B equity</text><text x="945.00" y="225.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">For $100B equity</text><text x="56.00" y="314.00" font-family="Arial,sans-serif" font-size="34" fill="#202723" text-anchor="start" font-weight="700">18%</text><text x="540.00" y="306.00" font-family="Arial,sans-serif" font-size="36" fill="#202723" text-anchor="middle" font-weight="700">$127.7B</text><text x="540.00" y="337.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">40.4% annual revenue growth</text><text x="945.00" y="306.00" font-family="Arial,sans-serif" font-size="36" fill="#202723" text-anchor="middle" font-weight="700">$208.0B</text><text x="945.00" y="337.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">47.4% annual revenue growth</text><rect x="56.00" y="381.00" width="1088.00" height="90.00" fill="#dde3d5"/><text x="56.00" y="432.00" font-family="Arial,sans-serif" font-size="34" fill="#202723" text-anchor="start" font-weight="700">22%</text><text x="540.00" y="424.00" font-family="Arial,sans-serif" font-size="36" fill="#202723" text-anchor="middle" font-weight="700">$99.5B</text><text x="540.00" y="455.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">36.9% annual revenue growth</text><text x="945.00" y="424.00" font-family="Arial,sans-serif" font-size="36" fill="#202723" text-anchor="middle" font-weight="700">$162.9B</text><text x="945.00" y="455.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">43.8% annual revenue growth</text><text x="56.00" y="550.00" font-family="Arial,sans-serif" font-size="34" fill="#202723" text-anchor="start" font-weight="700">26%</text><text x="540.00" y="542.00" font-family="Arial,sans-serif" font-size="36" fill="#202723" text-anchor="middle" font-weight="700">$81.1B</text><text x="540.00" y="573.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">34.1% annual revenue growth</text><text x="945.00" y="542.00" font-family="Arial,sans-serif" font-size="36" fill="#202723" text-anchor="middle" font-weight="700">$133.3B</text><text x="945.00" y="573.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">41.0% annual revenue growth</text><line x1="56.00" y1="666.00" x2="1144.00" y2="666.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="703.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">12% required return, 3% terminal growth, 15% return on new capital; $3B assumed net cash.</text><text x="56.00" y="730.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">No outside-claim deduction. These are conditional hurdles, not forecasts or completed financings.</text></svg>
