<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" style="background:#f4f1e8">
  <title id="title">Ownership structures in the 25-facility sample</title>
  <desc id="desc">Fourteen conventional public systems, one divided public system, three returned to public control, five public-title private revenue-risk concessions, one privately titled road, and one availability-payment project.</desc>
  <rect width="1600" height="1000" fill="#f4f1e8"/>
  <g fill="#151515" font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="105" font-size="28" letter-spacing="5">STRUCTURAL SAMPLE / SEPTEMBER 2, 2026</text>
    <text x="90" y="175" font-family="Georgia, serif" font-style="italic" font-size="66">25 facilities. Six ownership structures.</text>
    <text x="90" y="225" font-size="24" fill="#555">Counts describe this selected sample, not every toll facility in the United States.</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#151515">
    <text x="90" y="330" font-size="24">Conventional public authority</text><text x="1460" y="330" text-anchor="end" font-size="34">14</text>
    <rect x="90" y="350" width="1190" height="46" fill="#151515"/>
    <text x="90" y="460" font-size="24">Public title / private revenue-risk concession</text><text x="1460" y="460" text-anchor="end" font-size="34">5</text>
    <rect x="90" y="480" width="425" height="46" fill="#151515"/>
    <text x="90" y="590" font-size="24">Returned to public control</text><text x="1460" y="590" text-anchor="end" font-size="34">3</text>
    <rect x="90" y="610" width="255" height="46" fill="#151515"/>
    <text x="90" y="720" font-size="24">Divided public responsibility</text><text x="1460" y="720" text-anchor="end" font-size="34">1</text>
    <rect x="90" y="740" width="85" height="46" fill="#151515"/>
    <text x="650" y="720" font-size="24">Privately titled facility</text><text x="1110" y="720" text-anchor="end" font-size="34">1</text>
    <rect x="650" y="740" width="85" height="46" fill="#151515"/>
    <text x="90" y="850" font-size="24">Public revenue / availability-payment DBFOM</text><text x="1460" y="850" text-anchor="end" font-size="34">1</text>
    <rect x="90" y="870" width="85" height="46" fill="#151515"/>
  </g>
</svg>
