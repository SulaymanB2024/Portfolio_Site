<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Supply assumptions materially change per-token valuation</title><desc id="desc">Holding base value fixed at $28.626bn, 222.45m claims gives $128.68; 501.85m gives $57.04; 707m gives $40.49; 955.31m gives $29.96. These are different denominator conventions, not a forecast of circulating supply.</desc><rect width="720" height="520" fill="#F6F3EA"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="46" font-size="19" fill="#516169" font-weight="600" text-anchor="start">03 / DENOMINATOR SENSITIVITY</text><text x="36" y="88" font-size="30" fill="#172A30" font-weight="700" text-anchor="start">Same $28.63bn. Different token value.</text><text x="36" y="124" font-size="22" fill="#516169" font-weight="400" text-anchor="start">Only the assumed economic claims change.</text><text x="36" y="166" font-size="22" fill="#172A30" font-weight="400" text-anchor="start">222.45m circulating</text><rect x="36" y="179" width="503.70606792889737" height="26" fill="#B3C4C3"/><text x="675" y="203" font-size="25" fill="#172A30" font-weight="700" text-anchor="end">$128.68</text><text x="36" y="244" font-size="22" fill="#172A30" font-weight="400" text-anchor="start">501.85m future claims</text><rect x="36" y="257" width="223.2724242529614" height="26" fill="#B3C4C3"/><text x="675" y="281" font-size="25" fill="#172A30" font-weight="700" text-anchor="end">$57.04</text><text x="36" y="322" font-size="22" fill="#172A30" font-weight="400" text-anchor="start">707m future claims</text><rect x="36" y="335" width="158.48573523448826" height="26" fill="#B3C4C3"/><text x="675" y="359" font-size="25" fill="#172A30" font-weight="700" text-anchor="end">$40.49</text><text x="36" y="400" font-size="22" fill="#172A30" font-weight="400" text-anchor="start">955.31m total supply</text><rect x="36" y="413" width="117.29115659920154" height="26" fill="#176A75"/><text x="675" y="437" font-size="25" fill="#172A30" font-weight="700" text-anchor="end">$29.96</text><text x="36" y="488" font-size="19" fill="#516169" font-weight="400" text-anchor="start">Supply conventions are not interchangeable. No second buyback benefit.</text></g></svg>
