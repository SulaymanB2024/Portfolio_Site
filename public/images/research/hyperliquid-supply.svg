<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Same business. Different claims.</title><desc id="desc">Same $28.63bn value allocated across different economic-claim assumptions. The current-float-only case ignores potential dilution.</desc><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6"><path d="M-1 1L1-1M0 6L6 0M5 7L7 5" stroke="#68665e" stroke-width="1.3"/></pattern></defs><rect x="0.000" y="0.000" width="720.000" height="460.000" fill="#f5f2ea"/><g font-family="Arial, Helvetica, sans-serif"><text x="34" y="35" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">03 / HYPERLIQUID</text><text x="34" y="79" font-size="29" fill="#24221e" font-weight="600" text-anchor="start">Same business. Different claims.</text><text x="34" y="113" font-size="18" fill="#68665e" font-weight="400" text-anchor="start">Central value / $28.63bn / only supply changes</text><text x="34" y="157" font-size="18" fill="#24221e" font-weight="400" text-anchor="start">Current float only (not central) / 222m</text><rect x="34.000" y="168.000" width="494.939" height="25.000" fill="#b7b1a4"/><text x="686" y="190" font-size="24" fill="#24221e" font-weight="600" text-anchor="end">$128.68</text><text x="34" y="220" font-size="18" fill="#24221e" font-weight="400" text-anchor="start">Alternative allocation / 502m</text><rect x="34.000" y="231.000" width="219.386" height="25.000" fill="#b7b1a4"/><text x="686" y="253" font-size="24" fill="#24221e" font-weight="600" text-anchor="end">$57.04</text><text x="34" y="283" font-size="18" fill="#24221e" font-weight="400" text-anchor="start">Alternative allocation / 707m</text><rect x="34.000" y="294.000" width="155.727" height="25.000" fill="#b7b1a4"/><text x="686" y="316" font-size="24" fill="#24221e" font-weight="600" text-anchor="end">$40.49</text><text x="34" y="346" font-size="18" fill="#24221e" font-weight="400" text-anchor="start">Conservative full allocation / 955m</text><rect x="34.000" y="357.000" width="115.250" height="25.000" fill="#24221e"/><text x="686" y="379" font-size="24" fill="#24221e" font-weight="600" text-anchor="end">$29.96</text><line x1="34" x2="686" y1="418" y2="418" stroke="#b7b1a4"/><text x="34" y="444" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">Alternative denominators are not forecasts of future circulation.</text></g></svg>
