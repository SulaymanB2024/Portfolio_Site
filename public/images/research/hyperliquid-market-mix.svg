<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 720 520" role="img" aria-labelledby="title desc"><title id="title">Non-crypto perps create 40% of turnover but only 15.7% of perp fees</title><desc id="desc">2031 base case: crypto $12tn at 2.5 net basis points earns $3bn; non-crypto $8tn at 0.7 net basis points earns $0.56bn. All are assumptions.</desc><rect width="720" height="520" fill="#F6F3EA"/><g font-family="Arial, Helvetica, sans-serif"><text x="36" y="46" font-size="19" fill="#516169" font-weight="600" text-anchor="start">02 / AUTHOR BASE CASE · 2031</text><text x="36" y="89" font-size="32" fill="#172A30" font-weight="700" text-anchor="start">40% of volume. 16% of perp fees.</text><text x="36" y="126" font-size="23" fill="#516169" font-weight="400" text-anchor="start">Crypto perps / non-crypto perps</text><text x="36" y="184" font-size="24" fill="#172A30" font-weight="400" text-anchor="start">Perpetual turnover · $20tn</text><rect x="36" y="204" width="388.8" height="58" fill="#176A75"/><rect x="424.8" y="204" width="259.2" height="58" fill="#B3C4C3"/><text x="52" y="242" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="start">60%</text><text x="668" y="242" font-size="25" fill="#172A30" font-weight="700" text-anchor="end">40%</text><text x="36" y="306" font-size="24" fill="#172A30" font-weight="400" text-anchor="start">Net perpetual fees · $3.56bn</text><rect x="36" y="326" width="546.0674157303371" height="58" fill="#176A75"/><rect x="582.0674157303371" y="326" width="101.93258426966295" height="58" fill="#B3C4C3"/><text x="52" y="364" font-size="27" fill="#FFFFFF" font-weight="700" text-anchor="start">84.3%</text><text x="668" y="364" font-size="25" fill="#172A30" font-weight="700" text-anchor="end">15.7%</text><rect x="36" y="432" width="18" height="18" fill="#176A75"/><text x="64" y="449" font-size="23" fill="#172A30" font-weight="400" text-anchor="start">Crypto: 2.5 bps</text><rect x="340" y="432" width="18" height="18" fill="#B3C4C3"/><text x="368" y="449" font-size="23" fill="#172A30" font-weight="400" text-anchor="start">Non-crypto: 0.7 bps</text><text x="36" y="491" font-size="20" fill="#516169" font-weight="400" text-anchor="start">Net to HYPE. Excludes spot, reserve income and other fees.</text></g></svg>
