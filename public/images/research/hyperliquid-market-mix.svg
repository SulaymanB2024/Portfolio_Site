<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">40% of volume. 16% of perp fees.</title><desc id="desc">Central 2031 model: crypto $12tn at 2.5 bps; non-crypto $8tn at 0.7 bps. These are assumptions.</desc><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6"><path d="M-1 1L1-1M0 6L6 0M5 7L7 5" stroke="#68665e" stroke-width="1.3"/></pattern></defs><rect x="0.000" y="0.000" width="720.000" height="460.000" fill="#f5f2ea"/><g font-family="Arial, Helvetica, sans-serif"><text x="34" y="35" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">02 / HYPERLIQUID</text><text x="34" y="79" font-size="29" fill="#24221e" font-weight="600" text-anchor="start">40% of volume. 16% of perp fees.</text><text x="34" y="113" font-size="18" fill="#68665e" font-weight="400" text-anchor="start">Central case / 2031 / crypto versus non-crypto</text><text x="34" y="180" font-size="22" fill="#24221e" font-weight="400" text-anchor="start">Perpetual turnover / $20tn</text><rect x="34.000" y="198.000" width="391.200" height="47.000" fill="#24221e"/><rect x="425.200" y="198.000" width="260.800" height="47.000" fill="#b7b1a4"/><text x="49" y="231" font-size="24" fill="#f5f2ea" font-weight="600" text-anchor="start">60%</text><text x="672" y="231" font-size="24" fill="#24221e" font-weight="600" text-anchor="end">40%</text><text x="34" y="305" font-size="22" fill="#24221e" font-weight="400" text-anchor="start">Net perpetual receipts / $3.56bn</text><rect x="34.000" y="323.000" width="549.438" height="47.000" fill="#24221e"/><rect x="583.438" y="323.000" width="102.562" height="47.000" fill="#b7b1a4"/><text x="49" y="356" font-size="24" fill="#f5f2ea" font-weight="600" text-anchor="start">84.3%</text><text x="672" y="356" font-size="24" fill="#24221e" font-weight="600" text-anchor="end">15.7%</text><text x="34" y="398" font-size="18" fill="#24221e" font-weight="400" text-anchor="start">Crypto: 2.5 bps</text><text x="388" y="398" font-size="18" fill="#68665e" font-weight="400" text-anchor="start">Non-crypto: 0.7 bps</text><line x1="34" x2="686" y1="418" y2="418" stroke="#b7b1a4"/><text x="34" y="444" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">Author assumptions. Rates are net to HYPE; other products excluded.</text></g></svg>
