<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Kalshi’s $40 billion question</title><desc id="desc">A valuation by Sulayman Bowles, October 14 2026. Equity estimates depend on $1 billion assumed net cash. Weighted value $29.5 billion.</desc><rect width="1200" height="630" fill="#f5f2eb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a32}.serif{font-family:Georgia,'Times New Roman',serif}.small{font-size:18px;fill:#586169}.num{font-variant-numeric:tabular-nums}.axis{stroke:#cfcac0;stroke-width:1}</style><text x="54" y="68" font-size="20" class="" text-anchor="start" style="fill:#586169">SULAYMAN BOWLES / FINANCIAL SYSTEMS</text><line x1="54" y1="94" x2="1146" y2="94" stroke="#cfcac0" stroke-width="1.5"/><text x="54" y="200" font-size="69" class="serif" text-anchor="start">Kalshi’s</text><text x="54" y="280" font-size="69" class="serif" text-anchor="start">$40 billion</text><text x="54" y="360" font-size="69" class="serif" text-anchor="start">question</text><text x="54" y="435" font-size="27" class="" text-anchor="start">A valuation of the fees</text><text x="54" y="475" font-size="27" class="" text-anchor="start">the exchange gets to keep.</text><text x="54" y="574" font-size="20" class="" text-anchor="start" style="fill:#586169">14 OCTOBER 2026</text><text x="615" y="155" font-size="20" class="" text-anchor="start" style="fill:#586169">CONDITIONAL EQUITY VALUE</text><text x="615" y="221" font-size="25" class="" text-anchor="start">Restricted</text><text x="1138" y="221" font-size="28" class="" text-anchor="end">$3.6bn</text><rect x="615" y="241" width="29.07" height="20" fill="#586169"/><text x="615" y="326" font-size="25" class="" text-anchor="start">Base</text><text x="1138" y="326" font-size="28" class="" text-anchor="end">$27.4bn</text><rect x="615" y="346" width="220.51" height="20" fill="#39596c"/><text x="615" y="431" font-size="25" class="" text-anchor="start">Breakout</text><text x="1138" y="431" font-size="28" class="" text-anchor="end">$59.7bn</text><rect x="615" y="451" width="480.41" height="20" fill="#586169"/><line x1="936.8461538461538" y1="176" x2="936.8461538461538" y2="477" stroke="#914b3d" stroke-width="1.5" stroke-dasharray="7 7"/><text x="936.8461538461538" y="508" font-size="20" class="" text-anchor="middle" style="fill:#914b3d">$40bn discussed</text><text x="615" y="561" font-size="29" class="serif" text-anchor="start">Weighted: $29.5bn</text><text x="615" y="592" font-size="18" class="" text-anchor="start" style="fill:#586169">Includes $1bn assumed unrestricted net cash.</text></svg>
