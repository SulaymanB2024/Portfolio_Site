<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">Base valuation bridge</title><desc id="desc">Explicit forecast including stub $14.35 billion; discounted terminal $12.06 billion; assumed unrestricted net cash $1.00 billion; total equity $27.41 billion. Terminal value is 45.7% of enterprise value.</desc><rect width="640" height="450" fill="#f5f2eb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a32}.serif{font-family:Georgia,'Times New Roman',serif}.small{font-size:18px;fill:#586169}.num{font-variant-numeric:tabular-nums}.axis{stroke:#cfcac0;stroke-width:1}</style><text x="30" y="42" font-size="30" class="serif" text-anchor="start">The cash flows behind $27.4bn.</text><text x="30" y="75" font-size="20" class="" text-anchor="start">Base case · present value as of Oct. 14, 2026</text><text x="30" y="118" font-size="21" class="" text-anchor="start">Explicit cash flows, 2026–2036</text><text x="607" y="118" font-size="24" class="num" text-anchor="end">$14.35bn</text><rect x="30" y="131" width="294.68" height="20" fill="#586169"/><text x="30" y="201" font-size="21" class="" text-anchor="start">+ Terminal business value</text><text x="607" y="201" font-size="24" class="num" text-anchor="end">$12.06bn</text><rect x="30" y="214" width="247.58" height="20" fill="#586169"/><text x="30" y="284" font-size="21" class="" text-anchor="start">+ Assumed net corporate cash</text><text x="607" y="284" font-size="24" class="num" text-anchor="end">$1.00bn</text><rect x="30" y="297" width="20.54" height="20" fill="#586169"/><text x="30" y="367" font-size="21" class="" text-anchor="start">= Aggregate equity value</text><text x="607" y="367" font-size="24" class="num" text-anchor="end">$27.41bn</text><rect x="30" y="380" width="562.80" height="20" fill="#39596c"/></svg>
