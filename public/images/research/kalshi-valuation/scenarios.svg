<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc"><title id="title">Conditional equity values versus the reported financing discussion</title><desc id="desc">Restricted $3.6 billion, base $27.4 billion, breakout $59.7 billion. Underwriting weights 25%, 50%, 25%. Weighted $29.5 billion. $40 billion is a financing discussion, not a verified closed round.</desc><rect width="640" height="470" fill="#f5f2eb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a32}.serif{font-family:Georgia,'Times New Roman',serif}.small{font-size:18px;fill:#586169}.num{font-variant-numeric:tabular-nums}.axis{stroke:#cfcac0;stroke-width:1}</style><text x="30" y="40" font-size="29" class="serif" text-anchor="start">The $40bn price is not the base case.</text><text x="30" y="72" font-size="20" class="" text-anchor="start">Equity value · $1bn assumed net cash</text><line x1="383.84615384615387" y1="108" x2="383.84615384615387" y2="432" stroke="#914b3d" stroke-width="1.5" stroke-dasharray="5 5"/><text x="390.84615384615387" y="98" font-size="18" class="" text-anchor="start" style="fill:#914b3d">$40bn</text><text x="30" y="134" font-size="21" class="" text-anchor="start">Restricted · 25% weight</text><text x="605" y="134" font-size="24" class="num" text-anchor="end">$3.6bn</text><rect x="30" y="146" width="31.96" height="20" fill="#586169"/><text x="30" y="219" font-size="21" class="" text-anchor="start">Base · 50% weight</text><text x="605" y="219" font-size="24" class="num" text-anchor="end">$27.4bn</text><rect x="30" y="231" width="242.44" height="20" fill="#39596c"/><text x="30" y="304" font-size="21" class="" text-anchor="start">Breakout · 25% weight</text><text x="605" y="304" font-size="24" class="num" text-anchor="end">$59.7bn</text><rect x="30" y="316" width="528.17" height="20" fill="#586169"/><text x="30" y="389" font-size="21" class="" text-anchor="start">Weighted estimate</text><text x="605" y="389" font-size="24" class="num" text-anchor="end">$29.5bn</text><rect x="30" y="401" width="261.25" height="20" fill="#39596c"/><text x="30" y="457" font-size="18" class="small" text-anchor="start">Conditional scenarios, not a confidence interval.</text></svg>
