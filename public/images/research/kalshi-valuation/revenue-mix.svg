<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">Sports remains 74.6% of revenue</title><desc id="desc">Author forecast. Sports $6.60 billion, other events $1.30 billion, perpetuals $0.50 billion, ancillary $0.45 billion. Total $8.85 billion.</desc><rect width="640" height="450" fill="#f5f2eb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a32}.serif{font-family:Georgia,'Times New Roman',serif}.small{font-size:18px;fill:#586169}.num{font-variant-numeric:tabular-nums}.axis{stroke:#cfcac0;stroke-width:1}</style><text x="30" y="42" font-size="30" class="serif" text-anchor="start">Sports still pays most of the bills.</text><text x="30" y="75" font-size="20" class="" text-anchor="start">2031 base case · economic net revenue</text><text x="30" y="121" font-size="22" class="" text-anchor="start">Sports events</text><text x="607" y="121" font-size="23" class="num" text-anchor="end">$6.60bn</text><rect x="30" y="133" width="542.14" height="19" fill="#39596c"/><text x="30" y="195" font-size="22" class="" text-anchor="start">Other events</text><text x="607" y="195" font-size="23" class="num" text-anchor="end">$1.30bn</text><rect x="30" y="207" width="106.79" height="19" fill="#586169"/><text x="30" y="269" font-size="22" class="" text-anchor="start">Perpetual futures</text><text x="607" y="269" font-size="23" class="num" text-anchor="end">$0.50bn</text><rect x="30" y="281" width="41.07" height="19" fill="#586169"/><text x="30" y="343" font-size="22" class="" text-anchor="start">Data and net interest</text><text x="607" y="343" font-size="23" class="num" text-anchor="end">$0.45bn</text><rect x="30" y="355" width="36.96" height="19" fill="#586169"/><line x1="30" y1="407" x2="607" y2="407" stroke="#cfcac0" stroke-width="1.5"/><text x="30" y="435" font-size="22" class="" text-anchor="start">Total</text><text x="607" y="435" font-size="25" class="num" text-anchor="end">$8.85bn</text></svg>
