<svg xmlns="http://www.w3.org/2000/svg" width="640" height="450" viewBox="0 0 640 450" role="img" aria-labelledby="title desc"><title id="title">Same contract count, different fee</title><desc id="desc">Calculated taker fee: 63 cents at price 10 cents or 90 cents; $1.75 at 50 cents. Default multiplier 1; rounding does not affect these three examples.</desc><rect width="640" height="450" fill="#f5f2eb"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a32}.serif{font-family:Georgia,'Times New Roman',serif}</style><text x="30" y="42" font-size="30" class="serif">Same contract count. Different fee.</text><text x="30" y="75" font-size="20">Default taker fee per 100 contracts</text><g stroke="#cfcac0" stroke-width="1.5"><path d="M66 351H602M66 293H602M66 235H602M66 177H602M66 119H602"/></g><g font-size="17" text-anchor="end"><text x="51" y="357">$0.00</text><text x="51" y="299">$0.50</text><text x="51" y="241">$1.00</text><text x="51" y="183">$1.50</text><text x="51" y="125">$2.00</text></g><path d="M66 351Q334 -55 602 351" fill="none" stroke="#39596c" stroke-width="4"/><g fill="#39596c"><circle cx="119.6" cy="277.92" r="5"/><circle cx="334" cy="148" r="5"/><circle cx="548.4" cy="277.92" r="5"/></g><g font-size="23" text-anchor="middle"><text x="119.6" y="258.92">$0.63</text><text x="334" y="129">$1.75</text><text x="548.4" y="258.92">$0.63</text></g><g font-size="19" text-anchor="middle"><text x="66" y="381">0%</text><text x="200" y="381">25%</text><text x="334" y="381">50%</text><text x="468" y="381">75%</text><text x="602" y="381">100%</text></g><text x="330" y="414" font-size="20" text-anchor="middle">Contract price as a share of $1 payout</text></svg>
