ght="400">$25.4B</text><text x="980.00" y="443.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="middle" font-weight="400">$26.0B</text><text x="56.00" y="500.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="start" font-weight="400">14%</text><text x="450.00" y="500.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="middle" font-weight="400">$20.8B</text><text x="715.00" y="500.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="middle" font-weight="400">$21.1B</text><text x="980.00" y="500.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="middle" font-weight="400">$21.5B</text><text x="56.00" y="557.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="start" font-weight="400">16%</text><text x="450.00" y="557.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="middle" font-weight="400">$14.9B</text><text x="715.00" y="557.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="middle" font-weight="400">$15.0B</text><text x="980.00" y="557.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="middle" font-weight="400">$15.1B</text><line x1="56.00" y1="666.00" x2="1144.00" y2="666.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="703.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">Growth requires reinvestment at 15% mature returns on new capital; it is not free.</text><text x="56.00" y="730.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">All equity bridges include hypothetical $3B net cash, before outside claims.</text></svg>
