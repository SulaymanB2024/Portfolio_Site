<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Changing the hurdle rate changes the price.</title><desc id="desc">Base gross equity sensitivity to 10%, 11%, 12%, 13%, 14% and 16% discount rates and 2%, 3%, 4% terminal growth. At 12% and 3% value is $30.7B. Not a confidence interval.</desc><rect x="0.00" y="0.00" width="1200.00" height="760.00" fill="#f5f2e9"/><text x="56.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="700">ANDURIL / 04 / THE REQUIRED RETURN</text><text x="1144.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="end" font-weight="400">14 OCT 2026</text><line x1="56.00" y1="66.00" x2="1144.00" y2="66.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="124.00" font-family="Georgia,serif" font-size="40" fill="#202723" text-anchor="start" font-weight="400">Changing the hurdle rate changes the price.</text><text x="56.00" y="166.00" font-family="Arial,sans-serif" font-size="22" fill="#59615a" text-anchor="start" font-weight="400">Base gross equity bridge · $B · same revenue, margins and explicit capital policies</text><text x="56.00" y="220.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="start" font-weight="400">Required return</text><text x="450.00" y="220.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">2% terminal growth</text><text x="715.00" y="220.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">3% terminal growth</text><text x="980.00" y="220.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">4% terminal growth</text><text x="56.00" y="272.00" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="start" font-weight="400">10%</text><text x="4