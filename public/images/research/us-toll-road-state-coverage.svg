<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc" style="background:#f4f1e8">
  <title id="title">States represented in the toll-road ownership sample</title>
  <desc id="desc">A grid lists the 16 states represented and the number of facility or system rows selected in each.</desc>
  <rect width="1600" height="1000" fill="#f4f1e8"/>
