<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Five separate questions inside a paid-off toll-road claim</title>
<desc id="desc">The diagram separates original project cost, road debt, system debt, legal tolling authority, and concession rights.</desc>
<rect width="1100" height="700" fill="#FFFFFF"/>
<text x="45" y="52" font-size="30" font-weight="700">“Paid off” is five different questions</text>
<text x="45" y="82" font-size="17" fill="#444444">A road can satisfy one test and remain tolled because another layer is still active.</text>
<rect x="45" y="105" width="1010" height="82" rx="4" fill="#F1F1F1" stroke="#B8B8B8"/><text x="75" y="154" font-size="27" font-weight="700">01</text><text x="145" y="139" font-size="23" font-weight="700">Initial project cost</text><text x="145" y="167" font-size="17" fill="#444444">Has cumulative net cash recovered the historical build cost?</text><rect x="45" y="210" width="1010" height="82" rx="4" fill="#FFFFFF" stroke="#B8B8B8"/><text x="75" y="259" font-size="27" font-weight="700">02</text><text x="145" y="244" font-size="23" font-weight="700">Road-level debt</text><text x="145" y="272" font-size="17" fill="#444444">Does this facility still have identifiable standalone debt?</text><rect x="45" y="315" width="1010" height="82" rx="4" fill="#F1F1F1" stroke="#B8B8B8"/><text x="75" y="364" font-size="27" font-weight="700">03</text><text x="145" y="349" font-size="23" font-weight="700">System debt and pledges</text><text x="145" y="377" font-size="17" fill="#444444">Can this road&#x27;s revenue support pooled obligations elsewhere?</text><rect x="45" y="420" width="1010" height="82" rx="4" fill="#FFFFFF" stroke="#B8B8B8"/><text x="75" y="469" font-size="27" font-weight="700">04</text><text x="145" y="454" font-size="23" font-weight="700">Legal tolling authority</text><text x="145" y="482" font-size="17" fill="#444444">Does a public body still have statutory power to charge?</text><rect x="45" y="525" width="1010" height="82" rx="4" fill="#F1F1F1" stroke="#B8B8B8"/><text x="75" y="574" font-size="27" font-weight="700">05</text><text x="145" y="559" font-size="23" font-weight="700">Concession rights</text><text x="145" y="587" font-size="17" fill="#444444">Does a private contract preserve revenue rights through a stated term?</text>
<text x="45" y="665" font-size="17" font-weight="700">Construction recovery is not the same as a legal toll-removal trigger.</text>
</svg>