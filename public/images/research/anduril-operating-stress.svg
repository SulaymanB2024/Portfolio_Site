<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Slower margin improvement is the larger risk.</title><desc id="desc">Base EV $27.7B, delayed margins $19.2B, 18% terminal margin $20.3B, 30-day slower collections $24.8B, 50% Arsenal-2 overrun $26.4B, combined stress $7.5B. Effects are not additive.</desc><rect x="0.00" y="0.00" width="1200.00" height="760.00" fill="#f5f2e9"/><text x="56.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="700">ANDURIL / 05 / WHAT BREAKS THE CASE</text><text x="1144.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="end" font-weight="400">14 OCT 2026</text><line x1="56.00" y1="66.00" x2="1144.00" y2="66.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="124.00" font-family="Georgia,serif" font-size="40" fill="#202723" text-anchor="start" font-weight="400">Slower margin improvement is the larger risk.</text><text x="56.00" y="166.00" font-family="Arial,sans-serif" font-size="22" fill="#59615a" text-anchor="start" font-weight="400">Deterministic operating stresses · current enterprise value, not equity value</text><text x="56.00" y="222.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="start" font-weight="400">Change to the base operating plan</text><text x="1060.00" y="222.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="end" font-weight="400">Enterprise value</text><line x1="640.00" y1="248.00" x2="640.00" y2="610.00" stroke="#c7ccbf" stroke-width="1"/><text x="640.00" y="644.00" font-family="Arial,sans-serif" font-size="19" fill="#59615a" text-anchor="middle" font-weight="400">$0B</text><line x1="780.00" y1="248.00" x2="780.00" y2="610.00" stroke="#c7ccbf" stroke-width="1"/><text x="780.00" y="644.00" font-family="Arial,sans-serif" font-size="19" fill="#59615a" text-anchor="middle" font-weight="400">$10B</text><line x1="920.00" y1="248.00" x2="920.00" y2="610.00" stroke="#c7ccbf" stroke-width="1"/><text x="920.00" y="644.00" font-family="Arial,sans-serif" font-size="19" fill="#59615a" text-anchor="middle" font-weight="400">$20B</text><line x1="1060.00" y1="248.00" x2="1060.00" y2="610.00" stroke="#c7ccbf" stroke-width="1"/><text x="1060.00" y="644.00" font-family="Arial,sans-serif" font-size="19" fill="#59615a" text-anchor="middle" font-weight="400">$30B</text><line x1="1027.58" y1="248.00" x2="1027.58" y2="610.00" stroke="#435847" stroke-width="1.5" stroke-dasharray="4 5"/><text x="56.00" y="282.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="700">Base</text><line x1="640.00" y1="275.00" x2="1027.58" y2="275.00" stroke="#59615a" stroke-width="2"/><circle cx="1027.58" cy="275.00" r="7" fill="#202723"/><text x="1041.58" y="282.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="700">$27.7B</text><text x="56.00" y="343.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="400">Margin ramp two years later</text><line x1="640.00" y1="336.00" x2="908.97" y2="336.00" stroke="#59615a" stroke-width="2"/><circle cx="908.97" cy="336.00" r="5" fill="#202723"/><text x="922.97" y="343.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="700">$19.2B</text><text x="56.00" y="404.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="400">Mature EBIT margin 18%, phased</text><line x1="640.00" y1="397.00" x2="924.16" y2="397.00" stroke="#59615a" stroke-width="2"/><circle cx="924.16" cy="397.00" r="5" fill="#202723"/><text x="938.16" y="404.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="700">$20.3B</text><text x="56.00" y="465.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="400">Collections 30 days slower</text><line x1="640.00" y1="458.00" x2="987.32" y2="458.00" stroke="#59615a" stroke-width="2"/><circle cx="987.32" cy="458.00" r="5" fill="#202723"/><text x="1001.32" y="465.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="700">$24.8B</text><text x="56.00" y="526.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="400">Arsenal-2 investment +50%</text><line x1="640.00" y1="519.00" x2="1009.29" y2="519.00" stroke="#59615a" stroke-width="2"/><circle cx="1009.29" cy="519.00" r="5" fill="#202723"/><text x="1023.29" y="526.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="700">$26.4B</text><text x="56.00" y="587.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="700">Combined operating stress</text><line x1="640.00" y1="580.00" x2="745.58" y2="580.00" stroke="#59615a" stroke-width="2"/><circle cx="745.58" cy="580.00" r="7" fill="#202723"/><text x="759.58" y="587.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="700">$7.5B</text><line x1="56.00" y1="666.00" x2="1144.00" y2="666.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="703.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">Each single stress changes only the stated assumption. Combined stress reruns all four together.</text><text x="56.00" y="730.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">Collection drag persists into the terminal period. Overrun has no assumed new depreciation shield.</text></svg>
