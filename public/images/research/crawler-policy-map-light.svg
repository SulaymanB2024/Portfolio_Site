<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Crawler policy intent map</title>
  <desc id="desc">A public source passes through a policy gate into separate search, training, and user-requested retrieval lanes.</desc>
  <rect width="1200" height="630" fill="#f1efe8"/>
  <g fill="none" stroke="#11110f" stroke-width="1">
    <path d="M0 91H1200M0 539H1200" opacity=".18"/>
    <path d="M142 315H397M523 315H679M806 175H1018M806 315H1018M806 455H1018"/>
    <circle cx="142" cy="315" r="55"/>
    <rect x="397" y="244" width="126" height="142"/>
    <circle cx="743" cy="315" r="64"/>
    <rect x="1018" y="132" width="126" height="86"/>
    <rect x="1018" y="272" width="126" height="86"/>
    <rect x="1018" y="412" width="126" height="86"/>
    <path d="M743 251V175H806M743 379V455H806M807 315H806"/>
    <circle cx="679" cy="315" r="4" fill="#56644d" stroke="none"/>
    <circle cx="806" cy="175" r="4" fill="#56644d" stroke="none"/>
    <circle cx="806" cy="315" r="4" fill="#56644d" stroke="none"/>
    <circle cx="806" cy="455" r="4" fill="#56644d" stroke="none"/>
  </g>
  <g fill="#11110f" font-family="Arial, Helvetica, sans-serif">
    <text x="78" y="402" font-size="13" letter-spacing="2">PUBLIC SOURCE</text>
    <text x="421" y="304" font-size="12" letter-spacing="2">POLICY</text>
    <text x="421" y="326" font-size="12" letter-spacing="2">GATE</text>
    <text x="708" y="307" font-size="12" letter-spacing="2">INTENT</text>
    <text x="699" y="329" font-size="12" letter-spacing="2">ROUTER</text>
    <text x="1044" y="166" font-size="11" letter-spacing="1.5">SEARCH</text>
    <text x="1044" y="187" font-size="11" letter-spacing="1.5">DISCOVERY</text>
    <text x="1044" y="306" font-size="11" letter-spacing="1.5">MODEL</text>
    <text x="1044" y="327" font-size="11" letter-spacing="1.5">TRAINING</text>
    <text x="1044" y="446" font-size="11" letter-spacing="1.5">USER</text>
    <text x="1044" y="467" font-size="11" letter-spacing="1.5">RETRIEVAL</text>
  </g>
  <g fill="#56644d" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2">
    <text x="49" y="58">01 / ACCESS IS A DECISION</text>
    <text x="904" y="589">ACCESS ≠ INDEXING ≠ TRUST</text>
  </g>
</svg>
