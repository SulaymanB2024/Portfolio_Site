<svg xmlns="http://www.w3.org/2000/svg" width="2310" height="1364" viewBox="0 0 2310 1364" role="img" aria-labelledby="title desc">
<title id="title">Public-evidence readiness differs sharply by solid-rocket-motor class</title>
<desc id="desc">A seven-supplier by three-motor-class matrix scores public evidence from zero announced only to four sustained program-qualified incumbent. Northrop Grumman and L3Harris score four in all classes; entrant evidence is stronger in tactical and medium classes than large and strategic motors.</desc>
