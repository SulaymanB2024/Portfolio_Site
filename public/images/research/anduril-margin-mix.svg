<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">A platform margin needs a platform-sized business.</title><desc id="desc">Author mix test. Base needs $17.4B software sales; the $61B reverse valuation needs $34.1B. Hardware contribution is 15%, software 50%, corporate cost 5%. No reported segment economics.</desc><rect x="0.00" y="0.00" width="1200.00" height="760.00" fill="#f5f2e9"/><text x="56.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="700">ANDURIL / 01 / THE MARGIN IN DOLLARS</text><text x="1144.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="end" font-weight="400">14 OCT 2026</text><line x1="56.00" y1="66.00" x2="1144.00" y2="66.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="124.00" font-family="Georgia,serif" font-size="40" fill="#202723" text-anchor="start" font-weight="400">A platform margin needs a platform-sized business.</text><text x="56.00" y="166.00" font-family="Arial,sans-serif" font-size="22" fill="#59615a" text-anchor="start" font-weight="400">A 22% operating margin requires 34.3% separate software at the stated contributions.</text><text x="56.00" y="230.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="start" font-weight="400">Required revenue in 2036</text><text x="340.00" y="230.00" font-family="Arial,sans-serif" font-size="19" fill="#59615a" text-anchor="start" font-weight="400">Hardware &amp; integrated systems</text><text x="800.00" y="230.00" font-family="Arial,sans-serif" font-size="19" fill="#435847" text-anchor="start" font-weight="400">Separate software</text><text x="56.00" y="341.00" font-family="Arial,sans-serif" font-size="24" fill="#202723" text-anchor="start" font-weight="700">Base case</text><rect x="340.00" y="312.00" width="233.24" height="52.00" fill="#c7ccbf"/><rect x="573.24" y="312.00" width="121.69" height="52.00" fill="#435847"/><text x="456.62" y="346.00" font-family="Arial,sans-serif" font-size="23" fill="#202723" text-anchor="middle" font-weight="400">$33.3B</text><text x="634.08" y="346.00" font-family="Arial,sans-serif" font-size="23" fill="#ffffff" text-anchor="middle" font-weight="400">$17.4B</text><text x="340.00" y="396.00" font-family="Arial,sans-serif" font-size="22" fill="#59615a" text-anchor="start" font-weight="400">Total: $50.7B · separately monetized software: 34.3%</text><text x="56.00" y="489.00" font-family="Arial,sans-serif" font-size="24" fill="#202723" text-anchor="start" font-weight="700">$61B price hurdle</text><rect x="340.00" y="460.00" width="457.56" height="52.00" fill="#c7ccbf"/><rect x="797.56" y="460.00" width="238.73" height="52.00" fill="#435847"/><text x="568.78" y="494.00" font-family="Arial,sans-serif" font-size="23" fill="#202723" text-anchor="middle" font-weight="400">$65.4B</text><text x="916.92" y="494.00" font-family="Arial,sans-serif" font-size="23" fill="#ffffff" text-anchor="middle" font-weight="400">$34.1B</text><text x="340.00" y="544.00" font-family="Arial,sans-serif" font-size="22" fill="#59615a" text-anchor="start" font-weight="400">Total: $99.5B · separately monetized software: 34.3%</text><text x="56.00" y="608.00" font-family="Arial,sans-serif" font-size="22" fill="#202723" text-anchor="start" font-weight="400">22% EBIT = 15% × hardware share + 50% × software share − 5% corporate cost</text><line x1="56.00" y1="666.00" x2="1144.00" y2="666.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="703.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">All inputs are author assumptions. Embedded software is not counted a second time.</text><text x="56.00" y="730.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">The $61B hurdle uses base operating economics and a hypothetical $3B net-cash bridge.</text></svg>
