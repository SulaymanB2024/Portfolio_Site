<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">Software must earn its share of the margin.</title><desc id="desc">At 15% hardware contribution, 50% software contribution and 5% corporate expense, base 22% EBIT needs 34.3% software revenue; upside 28% needs 51.4%.</desc>
<rect x="0" y="0" width="1200" height="760" rx="0" fill="#f5f2e9" stroke="none"/>
<text x="56" y="46" font-size="18" fill="#59615a" text-anchor="start" font-weight="700" font-family="Arial,sans-serif">ANDURIL / CAPITAL PRODUCTIVITY</text>
<text x="1144" y="46" font-size="18" fill="#59615a" text-anchor="end" font-weight="400" font-family="Arial,sans-serif">14 OCT 2026</text>
<line x1="56" y1="66" x2="1144" y2="66" stroke="#d3d5ca" stroke-width="1"/>
<text x="56" y="122" font-size="40" fill="#202723" text-anchor="start" font-weight="400" font-family="Georgia,serif">Software must earn its share of the margin.</text>
<text x="56" y="164" font-size="23" fill="#59615a" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">Illustrative sales mix required to reach the consolidated EBIT target</text>
<text x="56" y="230" font-size="42" fill="#202723" text-anchor="start" font-weight="400" font-family="Georgia,serif">15%</text>
<text x="56" y="266" font-size="22" fill="#59615a" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">Hardware contribution</text>
<text x="459" y="230" font-size="42" fill="#202723" text-anchor="start" font-weight="400" font-family="Georgia,serif">50%</text>
<text x="459" y="266" font-size="22" fill="#59615a" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">Software contribution</text>
<text x="858" y="230" font-size="42" fill="#202723" text-anchor="start" font-weight="400" font-family="Georgia,serif">5%</text>
<text x="858" y="266" font-size="22" fill="#59615a" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">Corporate expense</text>
<text x="56" y="384" font-size="30" fill="#202723" text-anchor="start" font-weight="700" font-family="Arial,sans-serif">22% EBIT</text>
<rect x="270" y="346" width="535.5714285714284" height="64" rx="0" fill="#dce2d2" stroke="none"/>
<rect x="805.5714285714284" y="346" width="279.4285714285715" height="64" rx="0" fill="#58694d" stroke="none"/>
<text x="292" y="387" font-size="25" fill="#202723" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">66% hardware</text>
<text x="827.5714285714284" y="387" font-size="25" fill="#f5f2e9" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">34% software</text>
<text x="270" y="444" font-size="20" fill="#59615a" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">Separately monetized software, not bundled hardware revenue.</text>
<text x="56" y="526" font-size="30" fill="#202723" text-anchor="start" font-weight="700" font-family="Arial,sans-serif">28% EBIT</text>
<rect x="270" y="488" width="395.85714285714283" height="64" rx="0" fill="#dce2d2" stroke="none"/>
<rect x="665.8571428571429" y="488" width="419.14285714285717" height="64" rx="0" fill="#58694d" stroke="none"/>
<text x="292" y="529" font-size="25" fill="#202723" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">49% hardware</text>
<text x="687.8571428571429" y="529" font-size="25" fill="#f5f2e9" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">51% software</text>
<text x="270" y="586" font-size="20" fill="#59615a" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">Separately monetized software, not bundled hardware revenue.</text>
<line x1="56" y1="670" x2="1144" y2="670" stroke="#d3d5ca" stroke-width="1"/>
<text x="56" y="704" font-size="18" fill="#59615a" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">Hardware and software figures are contribution assumptions after product costs; corporate cost is additional.</text>
<text x="56" y="732" font-size="18" fill="#59615a" text-anchor="start" font-weight="400" font-family="Arial,sans-serif">A 20% hardware contribution would reduce the software share needed for 22% EBIT to 23%.</text>
</svg>
