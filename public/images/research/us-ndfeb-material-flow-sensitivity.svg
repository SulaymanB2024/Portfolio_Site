<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Material-flow sensitivity for the U.S. magnet project stack</title><desc id="desc">Range bars compare finished magnet capacity with the gross alloy process flow and rare-earth mass implied by 54 to 81 percent alloy-to-magnet recovery.</desc><style>
