<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Paying in shares saves cash, not economic cost.</title><desc id="desc">Economic FCF deficit peaks at $10.48B. With hypothetical noncash compensation equal to 2% or 4% of sales, the timing-proxy deficit falls to $9.34B or $8.36B, before assumed liquidity. None is a treasury forecast.</desc><rect x="0.00" y="0.00" width="1200.00" height="760.00" fill="#f5f2e9"/><text x="56.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="700">ANDURIL / 02 / COST VERSUS CASH TIMING</text><text x="1144.00" y="46.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="end" font-weight="400">14 OCT 2026</text><line x1="56.00" y1="66.00" x2="1144.00" y2="66.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="124.00" font-family="Georgia,serif" font-size="40" fill="#202723" text-anchor="start" font-weight="400">Paying in shares saves cash, not economic cost.</text><text x="56.00" y="166.00" font-family="Arial,sans-serif" font-size="22" fill="#59615a" text-anchor="start" font-weight="400">Hypothetical noncash pay changes the timing proxy. It never increases the DCF value.</text><line x1="140.00" y1="568.38" x2="1080.00" y2="568.38" stroke="#c7ccbf" stroke-width="1"/><text x="118.00" y="575.38" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="end" font-weight="400">-10</text><line x1="140.00" y1="479.62" x2="1080.00" y2="479.62" stroke="#59615a" stroke-width="2"/><text x="118.00" y="486.62" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="end" font-weight="400">0</text><line x1="140.00" y1="390.88" x2="1080.00" y2="390.88" stroke="#c7ccbf" stroke-width="1"/><text x="118.00" y="397.88" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="end" font-weight="400">10</text><line x1="140.00" y1="302.12" x2="1080.00" y2="302.12" stroke="#c7ccbf" stroke-width="1"/><text x="118.00" y="309.12" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="end" font-weight="400">20</text><text x="140.00" y="642.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">2026*</text><text x="299.00" y="642.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">2028</text><text x="537.50" y="642.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">2031</text><text x="696.50" y="642.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">2033</text><text x="935.00" y="642.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="middle" font-weight="400">2036</text><path d="M140.00,484.03 L219.50,505.68 L299.00,527.03 L378.50,544.18 L458.00,553.86 L537.50,547.41 L617.00,522.09 L696.50,479.44 L776.00,422.10 L855.50,353.26 L935.00,271.27" fill="none" stroke="#435847" stroke-width="3" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="955.00" y="278.27" font-family="Arial,sans-serif" font-size="20" fill="#435847" text-anchor="start" font-weight="400">4% addback</text><path d="M140.00,484.19 L219.50,507.07 L299.00,530.18 L378.50,549.72 L458.00,562.51 L537.50,560.01 L617.00,539.58 L696.50,502.86 L776.00,452.51 L855.50,391.70 L935.00,318.71" fill="none" stroke="#59615a" stroke-width="3" stroke-linejoin="round" stroke-dasharray="9 5"/><text x="955.00" y="325.71" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="start" font-weight="400">2% addback</text><path d="M140.00,484.35 L219.50,508.45 L299.00,533.34 L378.50,555.27 L458.00,571.16 L537.50,572.61 L617.00,557.08 L696.50,526.27 L776.00,482.91 L855.50,430.14 L935.00,366.15" fill="none" stroke="#202723" stroke-width="4" stroke-linejoin="round"/><text x="955.00" y="373.15" font-family="Arial,sans-serif" font-size="20" fill="#202723" text-anchor="start" font-weight="400">Economic FCF</text><circle cx="537.50" cy="572.61" r="7" fill="#202723"/><text x="552.50" y="604.61" font-family="Arial,sans-serif" font-size="25" fill="#202723" text-anchor="start" font-weight="700">−$10.48B</text><text x="140.00" y="225.00" font-family="Arial,sans-serif" font-size="20" fill="#59615a" text-anchor="start" font-weight="400">Cumulative FCF or cash-timing proxy · $B</text><line x1="56.00" y1="666.00" x2="1144.00" y2="666.00" stroke="#c7ccbf" stroke-width="1"/><text x="56.00" y="703.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">*2026 contains only the assumed remaining-year stub. No financing proceeds are included.</text><text x="56.00" y="730.00" font-family="Arial,sans-serif" font-size="18" fill="#59615a" text-anchor="start" font-weight="400">Dashed lines add back hypothetical noncash pay. Actual compensation and treasury balances are unknown.</text></svg>
