<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">U.S. rare-earth magnet capacity by maturity</title>
  <desc id="desc">A stacked bar divides 37,750 stated units of disclosed firm-project capacity into 4,000 with commercial shipments, 3,600 in commissioning, ramp, or qualification, and 30,150 in future projects. Mixed source units normalize to 37,584–38,048 metric tonnes.</desc>
  <rect width="1600" height="900" fill="#f4f3ef"/>
  <g stroke="#deddd7" stroke-width="1">
    <path d="M80 120H1520M80 240H1520M80 360H1520M80 480H1520M80 600H1520M80 720H1520"/>
    <path d="M200 80V820M440 80V820M680 80V820M920 80V820M1160 80V820M1400 80V820"/>
  </g>
  <text x="90" y="90" font-family="Arial,Helvetica,sans-serif" font-size="22" letter-spacing="3" fill="#55554f">FIGURE 01 / PHYSICAL-CAPACITY AUDIT</text>
  <text x="90" y="165" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="700" fill="#171715">37,750 stated units is not current supply</text>
  <text x="90" y="215" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#565650">Mixed source units; normalized total: 37,584–38,048 metric tonnes</text>
  <g transform="translate(90 330)">
    <rect x="0" y="0" width="150.6" height="180" fill="#20201e"/>
    <rect x="150.6" y="0" width="135.6" height="180" fill="#777770"/>
    <rect x="286.2" y="0" width="1135.8" height="180" fill="#cecdc6"/>
    <rect x="0" y="0" width="1422" height="180" fill="none" stroke="#171715" stroke-width="3"/>
    <text x="18" y="55" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#ffffff">SHIPPING</text>
    <text x="18" y="105" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" fill="#ffffff">4,000</text>
    <text x="170" y="55" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#ffffff"><tspan x="170">RAMP / </tspan><tspan x="170" dy="27">QUAL.</tspan></text>
    <text x="170" y="134" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="700" fill="#ffffff">3,600</text>
    <text x="320" y="55" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#171715">FUTURE FIRM PROJECTS</text>
    <text x="320" y="112" font-family="Arial,Helvetica,sans-serif" font-size="52" font-weight="700" fill="#171715">30,150</text>
    <text x="320" y="150" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#4d4d48">80% of the project stack</text>
  </g>
  <g font-family="Arial,Helvetica,sans-serif" fill="#292926">
    <text x="90" y="625" font-size="23" font-weight="700">Commercial shipments</text>
    <text x="90" y="661" font-size="22"><tspan x="90">Disclosed nameplate plus public </tspan><tspan x="90" dy="32">shipment evidence. Not full utilization.</tspan></text>
    <text x="550" y="625" font-size="23" font-weight="700">Commissioning / qualification</text>
    <text x="550" y="661" font-size="22"><tspan x="550">Installed or starting lines without </tspan><tspan x="550" dy="32">broad recurring shipment evidence.</tspan></text>
    <text x="1080" y="625" font-size="23" font-weight="700">Future projects</text>
    <text x="1080" y="661" font-size="22"><tspan x="1080">Construction, funded expansions, </tspan><tspan x="1080" dy="32">and later phases.</tspan></text>
  </g>
  <line x1="90" y1="750" x2="1510" y2="750" stroke="#171715" stroke-width="2"/>
  <text x="90" y="795" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#4d4d48">Evidence cutoff: 2026-08-17 · Capacity ≠ qualified output · Source: project ledger and cited primary disclosures</text>
</svg>
