<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 720 460" role="img" aria-labelledby="title desc"><title id="title">Most of the value is still distant.</title><desc id="desc">Present value: $6.96bn during 2027–2031, $9.94bn during 2032–2036, and $11.72bn after 2036.</desc><defs><pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6"><path d="M-1 1L1-1M0 6L6 0M5 7L7 5" stroke="#68665e" stroke-width="1.3"/></pattern></defs><rect x="0.000" y="0.000" width="720.000" height="460.000" fill="#f5f2ea"/><g font-family="Arial, Helvetica, sans-serif"><text x="34" y="35" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">05 / HYPERLIQUID</text><text x="34" y="79" font-size="29" fill="#24221e" font-weight="600" text-anchor="start">Most of the value is still distant.</text><text x="34" y="113" font-size="18" fill="#68665e" font-weight="400" text-anchor="start">Central case / all values discounted to 14 Oct 2026</text><text x="34" y="169" font-size="23" fill="#24221e" font-weight="400" text-anchor="start">Present value / $28.63bn</text><rect x="34.000" y="192.000" width="158.599" height="52.000" fill="#24221e"/><rect x="192.599" y="192.000" width="226.368" height="52.000" fill="#b7b1a4"/><rect x="418.967" y="192.000" width="267.033" height="52.000" fill="url(#hatch)"/><text x="34" y="282" font-size="20" fill="#24221e" font-weight="400" text-anchor="start">2027–2031</text><text x="34" y="319" font-size="27" fill="#24221e" font-weight="600" text-anchor="start">$6.96bn</text><text x="34" y="350" font-size="17" fill="#68665e" font-weight="400" text-anchor="start">24.3% of value</text><text x="256" y="282" font-size="20" fill="#24221e" font-weight="400" text-anchor="start">2032–2036</text><text x="256" y="319" font-size="27" fill="#24221e" font-weight="600" text-anchor="start">$9.94bn</text><text x="256" y="350" font-size="17" fill="#68665e" font-weight="400" text-anchor="start">34.7% of value</text><text x="478" y="282" font-size="20" fill="#24221e" font-weight="400" text-anchor="start">After 2036</text><text x="478" y="319" font-size="27" fill="#24221e" font-weight="600" text-anchor="start">$11.72bn</text><text x="478" y="350" font-size="17" fill="#68665e" font-weight="400" text-anchor="start">41.0% of value</text><text x="34" y="394" font-size="24" fill="#24221e" font-weight="600" text-anchor="start">75.7% depends on flows after 2031.</text><line x1="34" x2="686" y1="418" y2="418" stroke="#b7b1a4"/><text x="34" y="444" font-size="15" fill="#68665e" font-weight="400" text-anchor="start">Author model. These are present values, not undiscounted receipts.</text></g></svg>
