<rect x="360.87" y="225" width="338.88" height="52" fill="#999999" />
<text x="530.31" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">44.6</text>
<rect x="699.75" y="225" width="270.25" height="52" fill="#D7D7D7" />
<text x="834.88" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">35.6</text>
<rect x="70" y="327" width="26" height="26" fill="#111111" /><text x="108" y="347" font-size="18">Operations</text><rect x="520" y="327" width="26" height="26" fill="#555555" /><text x="558" y="347" font-size="18">Repair &amp; maintenance</text><rect x="70" y="369" width="26" height="26" fill="#999999" /><text x="108" y="389" font-size="18">Debt service</text><rect x="520" y="369" width="26" height="26" fill="#D7D7D7" /><text x="558" y="389" font-size="18">Required reserve</text>
