<title id="title">FY2025 recurring obligations per one hundred dollars of operating revenue for CTTS and Grand Parkway</title>
<desc id="desc">Two horizontal stacked bars compare operations, repair and maintenance, debt service, and required reserves using the same TxDOT FY2025 reporting schedule.</desc>
<rect width="1100" height="520" fill="#FFFFFF"/>
<text x="35" y="48" font-size="29" font-weight="700">Same-basis comparison: two TxDOT systems</text>
<text x="35" y="80" font-size="18" fill="#444444">Dollars per $100 of each system's FY2025 operating revenue</text>
