<text x="210" y="326" font-size="15">0</text><text x="580" y="326" font-size="15">50</text><text x="948" y="326" font-size="15">100</text>
<text x="35" y="455" font-size="16" fill="#444444">Both rows use the same TxDOT FY2025 report, fiscal year, denominator and category schedule.</text>
<text x="35" y="483" font-size="16" fill="#444444">This is not a statewide allocation and should not be combined with NTTA or HCTRA's different reporting bases.</text>
