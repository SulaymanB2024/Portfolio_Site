<rect x="210.00" y="125" width="229.30" height="52" fill="#111111" />
<text x="324.65" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">30.2</text>
<rect x="439.30" y="125" width="146.62" height="52" fill="#555555" />
<text x="512.61" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">19.3</text>
<rect x="585.93" y="125" width="360.91" height="52" fill="#999999" />
<text x="766.38" y="158" text-anchor="middle" font-size="17" font-weight="700" fill="#111111">47.5</text>
<rect x="946.84" y="125" width="23.16" height="52" fill="#D7D7D7" />
<text x="35" y="252" font-size="22" font-weight="700">Grand Parkway</text>
<rect x="210.00" y="225" width="114.22" height="52" fill="#111111" />
<text x="267.11" y="258" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">15.0</text>
