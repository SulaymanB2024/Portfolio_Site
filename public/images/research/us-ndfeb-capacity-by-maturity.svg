<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">U.S. sintered NdFeB capacity by industrial maturity</title><desc id="desc">A stacked bar shows 4,000 tonnes at plants with commercial shipments, 3,600 tonnes in commissioning, ramp or qualification, and 30,448 tonnes of future capacity.</desc><style>
.title{font:700 44px Arial,sans-serif;fill:#111}.deck{font:24px Arial,sans-serif;fill:#444}.label{font:600 24px Arial,sans-serif;fill:#111}.small{font:20px Arial,sans-serif;fill:#444}.num{font:700 28px Arial,sans-serif;fill:#111}.axis{stroke:#aaa;stroke-width:1}.grid{stroke:#ddd;stroke-width:1}.bar1{fill:#222}.bar2{fill:#777}.bar3{fill:#c9c9c9}.outline{fill:none;stroke:#111;stroke-width:2}
</style><rect width="100%" height="100%" fill="#fff"/><text x="90" y="100" class="title">Capacity by industrial maturity</text><text x="90" y="145" class="deck">Stated-unit annual nameplate, metric tonnes per year · research cutoff 16 Aug 2026</text><rect x="90.0" y="300" width="149.3" height="130" class="bar1"/><rect x="239.3" y="300" width="134.4" height="130" class="bar2"/><rect x="373.6" y="300" width="1136.4" height="130" class="bar3"/><rect x="90" y="300" width="1420" height="130" class="outline"/><rect x="90" y="532" width="34" height="34" class="bar1"/><text x="150" y="560" class="label">Commercial shipments + disclosed nameplate</text><text x="1450" y="560" text-anchor="end" class="num">4,000 tpa · 10.5%</text><rect x="90" y="612" width="34" height="34" class="bar2"/><text x="150" y="640" class="label">Commissioning / ramp / qualification</text><text x="1450" y="640" text-anchor="end" class="num">3,600 tpa · 9.5%</text><rect x="90" y="692" width="34" height="34" class="bar3"/><text x="150" y="720" class="label">Future capacity</text><text x="1450" y="720" text-anchor="end" class="num">30,448 tpa · 80.0%</text><text x="90" y="830" class="small">Nameplate is not realized output. “Commercial shipments” proves customer deliveries, not full utilization.</text></svg>