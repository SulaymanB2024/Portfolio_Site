<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">ViralBench and Codex agent improvement harness</title>
  <desc id="desc">ViralBench live loop, immutable evidence and evaluation, and a bounded Codex engineering loop.</desc>
  <rect width="1200" height="630" fill="#080807"/>
  <g stroke="#f4f4f0" stroke-opacity=".08">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M120 0v630M240 0v630M360 0v630M480 0v630M600 0v630M720 0v630M840 0v630M960 0v630M1080 0v630"/>
  </g>
  <g font-family="Inter,Arial,sans-serif">
    <text x="72" y="72" fill="#b7c8a8" font-size="14" letter-spacing="4">VIRALBENCH × CODEX / SYSTEM DESIGN</text>
    <text x="72" y="126" fill="#f4f4f0" font-family="Georgia,serif" font-size="48" font-style="italic">A controlled improvement loop</text>
    <g transform="translate(72 212)">
      <rect width="280" height="224" fill="#f4f4f0" fill-opacity=".025" stroke="#f4f4f0" stroke-opacity=".22"/>
      <text x="24" y="36" fill="#b7c8a8" font-size="11" letter-spacing="2">01 / LIVE INNER LOOP</text>
      <text x="24" y="84" fill="#f4f4f0" font-family="Georgia,serif" font-size="31" font-style="italic">ViralBench agent</text>
      <text x="24" y="125" fill="#f4f4f0" fill-opacity=".58" font-size="13">Research → create → preview</text>
      <text x="24" y="149" fill="#f4f4f0" fill-opacity=".58" font-size="13">→ submit → delayed outcome</text>
      <text x="24" y="194" fill="#f4f4f0" fill-opacity=".34" font-size="10" letter-spacing="2">PARTIAL OBSERVABILITY</text>
    </g>
    <path d="M370 324h54" stroke="#b7c8a8" stroke-width="2"/>
    <path d="m414 316 10 8-10 8" fill="none" stroke="#b7c8a8" stroke-width="2"/>
    <g transform="translate(442 190)">
      <rect width="316" height="268" fill="#b7c8a8" fill-opacity=".045" stroke="#b7c8a8" stroke-opacity=".82"/>
      <text x="24" y="40" fill="#b7c8a8" font-size="11" letter-spacing="2">02 / EVIDENCE SPINE</text>
      <text x="24" y="88" fill="#f4f4f0" font-family="Georgia,serif" font-size="31" font-style="italic">Trace + evaluator</text>
      <text x="24" y="130" fill="#f4f4f0" fill-opacity=".62" font-size="13">Sources and artifact lineage</text>
      <text x="24" y="155" fill="#f4f4f0" fill-opacity=".62" font-size="13">Versioned checks and replay</text>
      <text x="24" y="180" fill="#f4f4f0" fill-opacity=".62" font-size="13">Fixed-window outcome metrics</text>
      <path d="M24 210h268" stroke="#b7c8a8" stroke-opacity=".25"/>
      <text x="24" y="239" fill="#b7c8a8" font-size="10" letter-spacing="2">RAW EVIDENCE ≠ DERIVED CLAIM</text>
    </g>
    <path d="M776 324h54" stroke="#b7c8a8" stroke-width="2"/>
    <path d="m820 316 10 8-10 8" fill="none" stroke="#b7c8a8" stroke-width="2"/>
    <g transform="translate(848 212)">
      <rect width="280" height="224" fill="#f4f4f0" fill-opacity=".025" stroke="#f4f4f0" stroke-opacity=".22"/>
      <text x="24" y="36" fill="#b7c8a8" font-size="11" letter-spacing="2">03 / BOUNDED OUTER LOOP</text>
      <text x="24" y="84" fill="#f4f4f0" font-family="Georgia,serif" font-size="31" font-style="italic">Codex worktree</text>
      <text x="24" y="125" fill="#f4f4f0" fill-opacity=".58" font-size="13">Diagnose → patch → replay</text>
      <text x="24" y="149" fill="#f4f4f0" fill-opacity=".58" font-size="13">→ canary → promote / revert</text>
      <text x="24" y="194" fill="#f4f4f0" fill-opacity=".34" font-size="10" letter-spacing="2">NO SELF-DEPLOYMENT</text>
    </g>
    <text x="72" y="562" fill="#f4f4f0" fill-opacity=".42" font-size="12" letter-spacing="2">THE INNER AGENT MAKES THE POST. THE OUTER LOOP IMPROVES THE SYSTEM.</text>
  </g>
  <path d="M20 20h28M20 20v28M1180 20h-28M1180 20v28M20 610h28M20 610v-28M1180 610h-28M1180 610v-28" stroke="#b7c8a8" stroke-opacity=".55"/>
</svg>
